<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#f8fafc">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/icons/favicon-32.png">
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
  <link rel="stylesheet" href="https://pyw31337.github.io/lets/css/lets-design-system.css?v=1.1.0">
  <title>글로벌 10대 미술관 & 국립 박물관 컬렉션 — 렛츠아트 (Let's Art)</title>
  <style>
    :root {
      --lds-brand-600: #2563eb;
      --lds-brand-700: #1d4ed8;
      --lds-brand-50:  #eff6ff;
      --lds-canvas-bg: #ffffff;
      --lds-surface-subtle: #fafbfc;
      --lds-divider-faint: #f1f5f9;
      --lds-divider-line: #e2e8f0;
      --lds-text-strong: #0f172a;
      --lds-text-body: #334155;
      --lds-text-muted: #64748b;
      --lds-text-faint: #94a3b8;
      --lds-status-normal: #059669;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; min-width: 0; }
    body {
      background: var(--lds-canvas-bg);
      color: var(--lds-text-body);
      font-family: var(--lds-font-sans);
      font-size: 13px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
    }
    .container { max-width: 1440px; margin: 0 auto; padding: 24px 28px 80px; }

    /* SVG Icon System (Tabler & Lucide Standard) */
    .icon {
      width: 18px;
      height: 18px;
      display: inline-block;
      vertical-align: -3px;
      stroke: currentColor;
      fill: none;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
      flex-shrink: 0;
      transition: all 0.15s ease;
    }
    button:hover .icon, button:focus .icon, button:active .icon,
    a:hover .icon, a:focus .icon, a:active .icon,
    .active .icon, .icon.filled {
      fill: currentColor;
    }

    /* Header */
    header {
      background: var(--lds-canvas-bg);
      border-bottom: 1px solid var(--lds-divider-faint);
      padding: 18px 0 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 32px;
      flex-wrap: wrap;
      gap: 16px;
    }
    .logo-area { display: flex; align-items: center; gap: 12px; }
    .logo-badge {
      width: 36px; height: 36px;
      border-radius: 4px;
      background: #0f172a;
      color: #ffffff;
      display: grid;
      place-items: center;
    }
    .logo-badge .icon { stroke: #ffffff; width: 20px; height: 20px; }
    h1 { font-size: 19px; font-weight: 700; color: var(--lds-text-strong); letter-spacing: -0.3px; display: flex; align-items: center; gap: 8px; }
    .sub-title { font-size: 12px; color: var(--lds-text-muted); margin-top: 2px; }
    .nav-links { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    .lds-btn-nav {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 14px;
      border-radius: 4px;
      font-size: 12.5px;
      font-weight: 500;
      color: var(--lds-text-body);
      text-decoration: none;
      border: 1px solid var(--lds-divider-line);
      background: var(--lds-canvas-bg);
      transition: all 0.15s ease;
    }
    .lds-btn-nav:hover { background: var(--lds-surface-subtle); color: var(--lds-text-strong); border-color: var(--lds-text-faint); }
    .lds-btn-nav.primary { background: var(--lds-brand-600); color: #ffffff; border-color: var(--lds-brand-700); }
    .lds-btn-nav.primary:hover { background: var(--lds-brand-700); }
    .lds-btn-nav.active { background: var(--lds-brand-50); color: var(--lds-brand-600); border-color: var(--lds-brand-600); font-weight: 700; }

    /* Page Hero */
    .museum-hero {
      background: linear-gradient(135deg, #090e17 0%, #172554 100%);
      color: #ffffff;
      border-radius: 6px;
      padding: 44px 36px;
      margin-bottom: 36px;
      position: relative;
      overflow: hidden;
    }
    .museum-hero-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-family: var(--lds-font-mono);
      font-size: 11px;
      font-weight: 700;
      color: #60a5fa;
      background: rgba(37, 99, 235, 0.2);
      border: 1px solid rgba(96, 165, 250, 0.3);
      padding: 3px 8px;
      border-radius: 999px;
      margin-bottom: 14px;
    }
    .museum-hero h2 {
      font-size: 28px;
      font-weight: 800;
      letter-spacing: -0.03em;
      margin-bottom: 8px;
    }
    .museum-hero p {
      color: #cbd5e1;
      font-size: 14px;
      max-width: 720px;
      line-height: 1.6;
    }

    /* Museum Filter Tabs */
    .museum-nav-bar {
      display: flex;
      gap: 10px;
      overflow-x: auto;
      padding-bottom: 8px;
      margin-bottom: 28px;
      border-bottom: 1px solid var(--lds-divider-line);
    }
    .museum-pill-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 16px;
      border-radius: 4px;
      border: 1px solid var(--lds-divider-line);
      background: var(--lds-canvas-bg);
      color: var(--lds-text-body);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.15s ease;
    }
    .museum-pill-btn:hover { background: var(--lds-surface-subtle); border-color: var(--lds-text-faint); }
    .museum-pill-btn.active {
      background: var(--lds-text-strong);
      color: #ffffff;
      border-color: var(--lds-text-strong);
    }
    .museum-pill-btn .count {
      font-family: var(--lds-font-mono);
      font-size: 11px;
      opacity: 0.8;
    }

    /* Museum Detail Profile Card */
    .museum-profile-card {
      background: var(--lds-surface-subtle);
      border: 1px solid var(--lds-divider-line);
      border-radius: 4px;
      padding: 24px;
      margin-bottom: 32px;
      display: grid;
      grid-template-columns: 280px 1fr;
      gap: 28px;
    }
    @media (max-width: 860px) {
      .museum-profile-card { grid-template-columns: 1fr; }
    }
    .museum-profile-img {
      width: 100%;
      height: 200px;
      border-radius: 4px;
      object-fit: cover;
      background: #0f172a;
    }
    .museum-profile-title {
      font-size: 22px;
      font-weight: 800;
      color: var(--lds-text-strong);
      margin-bottom: 6px;
    }
    .museum-profile-meta {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 12px;
      color: var(--lds-text-muted);
      margin-bottom: 12px;
    }
    .museum-profile-desc {
      font-size: 13.5px;
      color: var(--lds-text-body);
      line-height: 1.6;
      margin-bottom: 16px;
    }
    .museum-profile-tags {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }
    .museum-tag-chip {
      font-family: var(--lds-font-mono);
      font-size: 11px;
      background: #ffffff;
      border: 1px solid var(--lds-divider-line);
      padding: 2px 8px;
      border-radius: 3px;
      color: var(--lds-text-muted);
    }

    /* Artwork Cards Grid */
    .grid-title-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }
    .grid-title {
      font-size: 16px;
      font-weight: 700;
      color: var(--lds-text-strong);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 20px;
    }
    .art-card {
      background: var(--lds-canvas-bg);
      border: 1px solid var(--lds-divider-line);
      border-radius: 4px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }
    .art-card:hover {
      border-color: var(--lds-brand-600);
      box-shadow: 0 4px 12px rgba(15, 23, 42, 0.05);
    }
    .card-img-wrap {
      width: 100%;
      height: 220px;
      position: relative;
      background: #090e17;
      overflow: hidden;
    }
    .card-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.3s ease;
    }
    .art-card:hover .card-img { transform: scale(1.03); }
    .card-badge {
      position: absolute;
      top: 10px;
      left: 10px;
      font-family: var(--lds-font-mono);
      font-size: 10px;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 2px;
      background: rgba(15, 23, 42, 0.85);
      color: #ffffff;
      backdrop-filter: blur(4px);
    }
    .card-video-pill {
      position: absolute;
      top: 10px;
      right: 10px;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      background: rgba(239, 68, 68, 0.9);
      color: #ffffff;
      padding: 2px 7px;
      border-radius: 2px;
      font-size: 10px;
      font-weight: 700;
    }
    .card-body {
      padding: 16px;
      display: flex;
      flex-direction: column;
      flex: 1;
    }
    .card-title {
      font-size: 14px;
      font-weight: 700;
      color: var(--lds-text-strong);
      margin-bottom: 2px;
    }
    .card-artist {
      font-size: 12px;
      color: var(--lds-text-muted);
      margin-bottom: 8px;
    }
    .card-desc {
      font-size: 12px;
      color: var(--lds-text-body);
      line-height: 1.5;
      margin-bottom: 12px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .card-actions {
      margin-top: auto;
      display: flex;
      gap: 6px;
      border-top: 1px solid var(--lds-divider-faint);
      padding-top: 12px;
    }
    .card-btn {
      flex: 1;
      padding: 6px 10px;
      border-radius: 3px;
      font-size: 11.5px;
      font-weight: 600;
      text-align: center;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      border: 1px solid var(--lds-divider-line);
      background: var(--lds-canvas-bg);
      color: var(--lds-text-body);
      transition: all 0.15s ease;
    }
    .card-btn:hover { background: var(--lds-surface-subtle); color: var(--lds-text-strong); }
    .card-btn.primary { background: var(--lds-brand-600); color: #ffffff; border-color: var(--lds-brand-700); }
    .card-btn.primary:hover { background: var(--lds-brand-700); }
  </style>
</head>
<body>

  <!-- Tabler & Lucide Standard SVG Sprite -->
  <svg width="0" height="0" style="position:absolute; display:none;" aria-hidden="true">
    <defs>
      <symbol id="i-museum" viewBox="0 0 24 24"><line x1="3" y1="21" x2="21" y2="21"></line><line x1="12" y1="3" x2="3" y2="8"></line><line x1="12" y1="3" x2="21" y2="8"></line><line x1="3" y1="8" x2="21" y2="8"></line><line x1="6" y1="8" x2="6" y2="21"></line><line x1="10" y1="8" x2="10" y2="21"></line><line x1="14" y1="8" x2="14" y2="21"></line><line x1="18" y1="8" x2="18" y2="21"></line></symbol>
      <symbol id="i-frame" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle><polyline points="21 15 16 10 5 21"></polyline></symbol>
      <symbol id="i-video" viewBox="0 0 24 24"><polygon points="6 4 20 12 6 20 6 4"></polygon></symbol>

      <symbol id="i-settings" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></symbol>

  </svg>

  <div class="container">
    <header>
      <div class="logo-area">
        <div class="logo-badge">
          <svg class="icon"><use href="#i-museum"/></svg>
        </div>
        <div>
          <h1>LET'S ART <span class="lds-tag-mono normal" style="margin-left:6px; font-size:10px; padding:2px 6px; background:#eff6ff; color:#2563eb; border-radius:3px;">MUSEUM EXPEDITION</span></h1>
          <div class="sub-title">글로벌 10대 미술관 & 국립 박물관 명작 컬렉션 탐색</div>
        </div>
      </div>
      <div class="nav-links">
        <a class="lds-btn-nav" href="index.html">
          <svg class="icon"><use href="#i-frame"/></svg>
          <span>갤러리 홈</span>
        </a>
        <a class="lds-btn-nav active" href="museum.html">
          <svg class="icon"><use href="#i-museum"/></svg>
          <span>미술관 탐색</span>
        </a>
        <a class="lds-btn-nav" href="artist.html">
          <svg class="icon"><use href="#i-user"/></svg>
          <span>거장 아카이브</span>
        </a>
        <a class="lds-btn-nav primary" href="artwork.html?id=paint_sargent_001&mode=presentation">
          <svg class="icon"><use href="#i-sparkles"/></svg>
          <span>디지털 액자 감상실</span>
        </a>
        <a class="lds-btn-nav" href="admin">
          <svg class="icon"><use href="#i-settings"/></svg>
          <span>관제 어드민</span>
        </a>
      </div>
    </header>

    <!-- Museum Hero Banner -->
    <div class="museum-hero">
      <div class="museum-hero-badge">GLOBAL 10 MUSEUMS OPEN ACCESS ARCHIVE</div>
      <h2>시대를 초월한 인류의 보물창고를 거닐다</h2>
      <p>파리 루브르와 오르세, 뉴욕 MoMA와 메트로폴리탄, 런던 대영박물관, 서울 국립중앙박물관까지. 각 미술관이 보존하고 있는 최고 수준의 인류 문화유산을 1:1 도슨트 해설과 함께 깊이 있게 탐색해 보세요.</p>
    </div>

    <!-- Museum Selection Tabs -->
    <div class="museum-nav-bar" id="museumTabBar">
      <!-- Injected via JS -->
    </div>

    <!-- Selected Museum Profile -->
    <div class="museum-profile-card" id="museumProfileCard">
      <!-- Injected via JS -->
    </div>

    <!-- Collection Artworks Grid -->
    <div class="grid-title-row">
      <div class="grid-title" id="gridTitleHeader">
        <svg class="icon"><use href="#i-frame"/></svg>
        <span>소장 명작 아카이브</span>
      </div>
      <span class="lds-mono" style="font-size:11.5px; color:var(--lds-text-muted);" id="gridCountBadge">0 ITEMS</span>
    </div>

    <div class="grid" id="museumArtworkGrid">
      <!-- Artworks Injected via JS -->
    </div>
  </div>

  <script>
    const MUSEUMS = [
      {
        id: "louvre",
        name_kr: "파리 루브르 박물관",
        name_en: "Musée du Louvre",
        city: "프랑스 파리 (Paris, France)",
        established: "1793년",
        description: "세계에서 가장 많은 방문객이 찾는 세계 최대의 미술관. 르네상스부터 19세기까지 인류 예술사의 기적이라 불리는 38만 점 이상의 소장품을 품고 있으며, <모나리자>, <사모트라케의 니케>, <밀로의 비너스>가 자리한 프랑스 문화의 상징입니다.",
        image: "https://pub-685f237e5a544431bee558c5b29f3291.r2.dev/featured/art_mona_lisa.webp",
        tags: ["고대 유물", "르네상스", "루브르 3대 보물", "프랑스 왕실 컬렉션"]
      },
      {
        id: "met",
        name_kr: "메트로폴리탄 미술관 (The Met)",
        name_en: "The Metropolitan Museum of Art",
        city: "미국 뉴욕 (New York, USA)",
        established: "1870년",
        description: "5번가 센트럴 파크에 위치한 북미 최대의 종합 미술관. 5천 년 인류 문명 전체를 포괄하는 200만 점 이상의 원장 컬렉션을 보유하고 있으며, 존 싱어 사전트의 <마담 X>, 베르메르, 렘브란트, 그리고 방대한 오픈 액세스 디지털 이니셔티브를 선도합니다.",
        image: "https://pub-685f237e5a544431bee558c5b29f3291.r2.dev/featured/paint_sargent_001.webp",
        tags: ["세계 4대 미술관", "오픈 액세스 선도", "고전 & 근현대", "센트럴파크"]
      },
      {
        id: "moma",
        name_kr: "뉴욕 근대미술관 (MoMA)",
        name_en: "The Museum of Modern Art",
        city: "미국 뉴욕 맨해튼 (Manhattan, New York)",
        established: "1929년",
        description: "현대 시각 예술의 가장 영향력 있는 산실. 빈센트 반 고흐의 <별이 빛나는 밤>, 살바도르 달리의 <기억의 지속>, 피카소의 <아비뇽의 처녀들>, 자코메티의 <걷는 사람> 등 20세기 모더니즘과 아방가르드 혁명의 정수가 살아 숨 쉬는 공간입니다.",
        image: "https://pub-685f237e5a544431bee558c5b29f3291.r2.dev/featured/art_starry_night.webp",
        tags: ["모더니즘", "아방가르드", "뉴욕의 심장", "반 고흐 & 피카소"]
      },
      {
        id: "nmk",
        name_kr: "국립중앙박물관 (NMK)",
        name_en: "National Museum of Korea",
        city: "대한민국 서울 용산 (Seoul, Korea)",
        established: "1945년",
        description: "반만년 유구한 한민족의 문화유산과 동아시아 문명을 아우르는 대한민국 대표 국립 박물관. 겸재 정선의 국보 <인왕제색도>, 티 없이 맑은 조선 <백자 달항아리>, 신라 금관과 금동미륵보살반가사유상 등 한국 미학의 극치를 보존합니다.",
        image: "https://pub-685f237e5a544431bee558c5b29f3291.r2.dev/featured/asian_jeongseon_inwang.webp",
        tags: ["대한민국 국보", "진경산수화", "조선 백자", "사유의 방"]
      },
      {
        id: "british_museum",
        name_kr: "대영박물관 (British Museum)",
        name_en: "The British Museum",
        city: "영국 런던 (London, UK)",
        established: "1753년",
        description: "세계 최초의 국립 공공 박물관. 로제타석, 파르테논 신전 조각군, 호쿠사이의 <가나가와 해변의 높은 파도> 목판화 원본 및 한광호 한국실 컬렉션을 소장하고 있으며, 인류 문명의 기원과 전파를 통시적으로 증언합니다.",
        image: "https://pub-685f237e5a544431bee558c5b29f3291.r2.dev/featured/asian_hokusai_great_wave.webp",
        tags: ["세계 3대 박물관", "인류 문명사", "호쿠사이 우키요에", "런던 랜드마크"]
      },
      {
        id: "chicago",
        name_kr: "시카고 미술관 (AIC)",
        name_en: "Art Institute of Chicago",
        city: "미국 시카고 (Chicago, USA)",
        established: "1879년",
        description: "미국에서 두 번째로 큰 미술관으로 인상파 및 후기 인상파 소장 규모는 파리 외부에서 최고 수준입니다. 조르주 쇠라의 <그랑드 자트 섬의 일요일 오후>, 피카소 청색시대의 <늙은 기타 연주자>, 에드워드 호퍼의 <밤을 지새우는 사람들>을 소장하고 있습니다.",
        image: "https://pub-685f237e5a544431bee558c5b29f3291.r2.dev/featured/art_seurat_grande_jatte.webp",
        tags: ["점묘주의 명작", "인상파 걸작", "피카소 청색시대", "시카고 랜드마크"]
      },
      {
        id: "rodin",
        name_kr: "파리 로댕 미술관",
        name_en: "Musée Rodin",
        city: "프랑스 파리 (Paris, France)",
        established: "1919년",
        description: "비롱 저택(Hôtel Biron)과 고요한 장미 정원에 자리한 근대 조각의 성지. 오귀스트 로댕이 생전에 기증한 <생각하는 사람>, <지옥의 문>, <입맞춤>, 카미유 클로델의 조각들을 원래 예술가가 호흡하던 공간 그대로 보존하고 있습니다.",
        image: "https://pub-685f237e5a544431bee558c5b29f3291.r2.dev/featured/sculpt_rodin_thinker.webp",
        tags: ["로댕의 생각하는 사람", "지옥의 문", "장미 정원", "파리 조각 성지"]
      },
      {
        id: "orsay",
        name_kr: "오르세 미술관",
        name_en: "Musée d'Orsay",
        city: "프랑스 파리 (Paris, France)",
        established: "1986년",
        description: "1900년 파리 만국박람회를 위해 건축된 옛 오르세 기차역을 개조하여 탄생한 인상주의의 성전. 마네, 모네, 르누아르, 세잔, 고흐의 아를 연작 등 1848년부터 1914년까지 빛을 좇은 인상파 화가들의 불멸의 캔버스가 모여 있습니다.",
        image: "https://pub-685f237e5a544431bee558c5b29f3291.r2.dev/uhd/250.webp",
        tags: ["인상주의 성지", "옛 기차역의 변신", "모네 & 반 고흐", "센강변"]
      }
    ];

    let currentMuseumId = "louvre";
    let allMasterworks = [];

    async function initMuseumExplorer() {
      // 1. Render Tabs
      const tabBar = document.getElementById('museumTabBar');
      tabBar.innerHTML = MUSEUMS.map((m, idx) => `
        <button class="museum-pill-btn ${idx === 0 ? 'active' : ''}" data-id="${m.id}" onclick="selectMuseum('${m.id}')">
          <svg class="icon"><use href="#i-museum"/></svg>
          <span>${m.name_kr}</span>
        </button>
      `).join('');

      // 2. Fetch Databases
      try {
        const [rPaint, rExp, rCont] = await Promise.all([
          fetch('data/art_paintings_master_db.json?v=' + Date.now()).then(r => r.json()).catch(() => ({ featured_masterpieces: [] })),
          fetch('data/expanded_art_categories_db.json?v=' + Date.now()).then(r => r.json()).catch(() => ({})),
          fetch('data/contemporary_art_and_architecture_db.json?v=' + Date.now()).then(r => r.json()).catch(() => ({}))
        ]);

        const list = [...(rPaint.featured_masterpieces || [])];
        Object.values(rExp).forEach(v => {
          if (Array.isArray(v) && v.length && typeof v[0] === 'object') list.push(...v);
        });
        Object.values(rCont).forEach(v => {
          if (Array.isArray(v) && v.length && typeof v[0] === 'object') list.push(...v);
        });

        allMasterworks = list;
        selectMuseum(currentMuseumId);
      } catch (e) {
        console.error("Museum load error:", e);
      }
    }

    function selectMuseum(id) {
      currentMuseumId = id;
      document.querySelectorAll('.museum-pill-btn').forEach(b => {
        b.classList.toggle('active', b.dataset.id === id);
      });

      const m = MUSEUMS.find(x => x.id === id);
      if (!m) return;

      // Profile Card
      document.getElementById('museumProfileCard').innerHTML = `
        <img class="museum-profile-img" src="${m.image}" alt="${m.name_kr}" onerror="this.src='assets/icons/icon-512.png'">
        <div>
          <h3 class="museum-profile-title">${m.name_kr}</h3>
          <div class="museum-profile-meta">
            <span>📍 ${m.city}</span>
            <span>·</span>
            <span>🏛️ 설립: ${m.established}</span>
            <span>·</span>
            <span>🌐 공식 오픈액세스 연동</span>
          </div>
          <p class="museum-profile-desc">${m.description}</p>
          <div class="museum-profile-tags">
            ${m.tags.map(t => `<span class="museum-tag-chip">#${t}</span>`).join('')}
          </div>
        </div>
      `;

      // Filter Artworks
      const matched = allMasterworks.filter(art => {
        const mus = (art.museum || art.location || '').toLowerCase();
        const key = (art.museum_key || '').toLowerCase();
        if (id === 'louvre') return mus.includes('루브르') || mus.includes('louvre') || key === 'louvre';
        if (id === 'met') return mus.includes('메트로폴리탄') || mus.includes('met') || key === 'met';
        if (id === 'moma') return mus.includes('moma') || mus.includes('근대미술관') || key === 'moma';
        if (id === 'nmk') return mus.includes('국립중앙') || mus.includes('간송') || mus.includes('korea') || key === 'nmk';
        if (id === 'british_museum') return mus.includes('대영') || mus.includes('british') || key === 'british_museum';
        if (id === 'chicago') return mus.includes('시카고') || mus.includes('chicago') || key === 'chicago';
        if (id === 'rodin') return mus.includes('로댕') || mus.includes('rodin') || key === 'rodin';
        if (id === 'orsay') return mus.includes('오르세') || mus.includes('orsay') || key === 'orsay';
        return false;
      });

      document.getElementById('gridCountBadge').textContent = `${matched.length} ITEMS CURATED`;

      const grid = document.getElementById('museumArtworkGrid');
      if (matched.length === 0) {
        grid.innerHTML = `<div style="grid-column: 1/-1; padding: 48px; text-align: center; color: var(--lds-text-muted);">해당 미술관 소장 원장을 분석하여 선별 중입니다.</div>`;
        return;
      }

      grid.innerHTML = matched.map(art => {
        const thumb = art.thumbnail_url || art.image_url || `assets/featured/thumbs/${art.id}.webp`;
        const hasVideo = art.verified_docent || (art.media_resources && art.media_resources.youtube_title);
        return `
          <div class="art-card">
            <div class="card-img-wrap">
              <img class="card-img" src="${thumb}" alt="${art.title_kr}" loading="lazy" onerror="this.src='assets/featured/thumbs/${art.id}.webp'">
              <span class="card-badge">${art.category_kr || '명화'}</span>
              ${hasVideo ? `<span class="card-video-pill"><svg class="icon" style="width:11px; height:11px; fill:#fff;"><use href="#i-video"/></svg> 1:1 도슨트</span>` : ''}
            </div>
            <div class="card-body">
              <div class="card-title">${art.title_kr}</div>
              <div class="card-artist">${art.artist_name_kr || ''} · ${art.year || ''}</div>
              <div class="card-desc">${art.curator_notes || art.description || '인류 문화유산 원장 상세 해설'}</div>
              <div class="card-actions">
                <a href="artwork.html?id=${art.id}" class="card-btn primary">
                  <span>작품 상세</span>
                  <svg class="icon" style="width:12px; height:12px;"><use href="#i-arrow-right"/></svg>
                </a>
                <a href="artwork.html?id=${art.id}&mode=presentation" class="card-btn">
                  <span>액자 모드</span>
                </a>
              </div>
            </div>
          </div>
        `;
      }).join('');
    }

    window.addEventListener('DOMContentLoaded', initMuseumExplorer);
  </script>
</body>
</html>
